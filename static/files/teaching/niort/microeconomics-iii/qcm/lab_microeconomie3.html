<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microéconomie III : QCM d'entraînement en ligne</title>
<style>
:root{
  --navy:#15496b; --orange:#e4754c; --ink:#1d2433; --muted:#5b6475; --line:#d9dee7;
  --bg:#f6f7f9; --card:#ffffff; --ok:#1f7a4d; --okbg:#e8f5ee; --ko:#b23a2e; --kobg:#fbecea;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Latin Modern Roman","Cambria","Georgia",serif}
header{background:var(--navy);color:#fff;border-bottom:4px solid var(--orange)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header .wrap{padding-top:18px;padding-bottom:16px}
header h1{margin:0;font-size:1.45rem;letter-spacing:.2px}
header p{margin:4px 0 0;font-size:.95rem;opacity:.9}
header p+p{margin-top:2px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px}
.logo{height:44px;width:auto;background:#fff;padding:4px 6px;border-radius:3px;flex:none}
@media (max-width:520px){.logo{height:32px}}
main{padding:18px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 18px 16px;margin-bottom:16px}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--muted);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.bar{height:5px;background:var(--line);border-radius:3px;margin:8px 0 16px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--orange);width:0;transition:width .25s}
.tag{display:inline-block;font-size:.78rem;color:var(--navy);border:1px solid var(--navy);border-radius:3px;padding:0 6px}
.qtext{font-size:1.06rem;margin:10px 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:5px;padding:10px 12px;font:inherit;color:inherit;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--navy)}
.opt .l{font-weight:bold;color:var(--navy);min-width:1.4em}
.opt[disabled]{cursor:default}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--ko);background:var(--kobg)}
.fb{margin-top:14px;border-left:4px solid var(--ok);background:var(--okbg);padding:10px 12px;border-radius:0 5px 5px 0}
.fb.ko{border-left-color:var(--ko);background:var(--kobg)}
.fb strong{display:block;margin-bottom:2px}
.fb .ref{font-size:.85rem;color:var(--muted);font-style:italic}
.actions{display:flex;justify-content:flex-end;margin-top:14px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:5px;padding:10px 18px;font:600 .95rem system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}
.btn.alt{background:var(--orange)}
.fig{margin:6px 0 12px;overflow-x:auto}
table.mx,table.tb{border-collapse:collapse;margin:0 auto;font-size:.95rem}
table.mx th,table.mx td{padding:6px 10px;text-align:center}
table.mx td.c{border:1px solid #9aa5b5;min-width:5.5em}
table.mx th.rp{writing-mode:vertical-rl;transform:rotate(180deg);color:var(--navy)}
table.mx th.cp{color:var(--navy)}
table.tb th,table.tb td{border:1px solid #9aa5b5;padding:5px 9px;text-align:center}
table.tb th{background:#eef1f5}
.plots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.plots svg{width:100%;max-width:340px;height:auto}
svg .ax{stroke:#333;stroke-width:1}
svg .cv{fill:none;stroke:var(--navy);stroke-width:2}
svg .ch{stroke:var(--orange);stroke-width:2}
svg .gd{stroke:#888;stroke-width:1;stroke-dasharray:4 3}
svg .pp{fill:#222}
svg text{font-family:system-ui,sans-serif}
svg .tk{font-size:11px;fill:#333}
svg .al{font-size:11.5px;fill:#333}
svg .pt{font-size:12px;fill:var(--navy);text-anchor:middle;font-weight:600}
.m{font-style:italic;white-space:nowrap}
.score{font-size:2.6rem;color:var(--navy);margin:4px 0 2px;font-weight:bold}
.res table{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:8px}
.res td,.res th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.res td.n{text-align:right;white-space:nowrap}
.res tr.tot td{font-weight:bold}
.intro ul{margin:6px 0 0;padding-left:1.2em}
footer{font-size:.8rem;color:var(--muted);text-align:center;padding:10px 0 24px}
@media (max-width:520px){
  body{font-size:15.5px}
  .card{padding:14px 12px}
  table.mx th,table.mx td{padding:5px 6px}
  table.mx td.c{min-width:4.2em}
}
</style>
<style id="quiz-mobile-layout">@media(max-width:520px){.qtext .m{white-space:normal}}</style></head>

const DATA = [{"id": "LR1", "dom": "J", "sec": "§13.4 Jeux répétés", "q": "Dans un jeu répété, une stratégie est", "fig": "", "o": ["une règle qui dit quoi jouer après chaque histoire possible", "la même action, jouée à l'identique à toutes les périodes du jeu", "l'action qui maximise le gain de la période en cours, sans regarder l'avenir", "l'action choisie à la première période, qui engage la suite du jeu"], "a": 0, "x": "La répétition rend la distinction stratégie/action essentielle&#8239;: une stratégie est une règle conditionnelle à l'histoire.", "r": "§13.4, diapo 66"}, {"id": "LN3", "dom": "J", "sec": "§13.3 Équilibre de Nash", "q": "Combien ce jeu a-t-il d'équilibres de Nash en stratégies pures&#8239;?", "fig": "<div class=\"fig\"><table class=\"mx\"><tr><td class=\"cp\" colspan=\"2\"></td><th class=\"cp\" colspan=\"2\">Joueur 2</th></tr><tr><td colspan=\"2\"></td><th>Gauche</th><th>Droite</th></tr><tr><th class=\"rp\" rowspan=\"2\">Joueur 1</th><th>Haut</th><td class=\"c\">2&#8239;; 0</td><td class=\"c\">0&#8239;; 3</td></tr><tr><th>Bas</th><td class=\"c\">1&#8239;; 2</td><td class=\"c\">3&#8239;; 1</td></tr></table></div>", "o": ["Un, (Haut, Droite)", "Un, (Bas, Droite), où le joueur 1 obtient son gain maximal", "Aucun", "Deux, (Haut, Gauche) et (Bas, Droite)"], "a": 2, "x": "Dans chaque case, l'un des joueurs veut changer&#8239;: (H,G) → le joueur 2 préfère D&#8239;; (H,D) → le joueur 1 préfère B&#8239;; (B,D) → le joueur 2 préfère G&#8239;; (B,G) → le joueur 1 préfère H.", "r": "§13.3, diapo 58"}, {"id": "la3", "dom": "R", "sec": "Bloc A Décrire le risque", "q": "Une loterie donne 100&nbsp;€ avec probabilité 0,2, 200&nbsp;€ avec probabilité 0,6 et 300&nbsp;€ avec probabilité 0,2. Son écart-type vaut", "fig": "", "o": ["81,65&nbsp;€", "63,25&nbsp;€", "40&nbsp;€", "4&#8239;000&nbsp;€"], "a": 1, "x": "E = 200&#8239;; Var = 0,2 × 100² + 0,6 × 0 + 0,2 × 100² = 4&#8239;000&#8239;; σ ≈ 63,25&nbsp;€. Le 81,65&nbsp;€ suppose des issues équiprobables.", "r": "Poly. A.5–A.6"}, {"id": "LN4", "dom": "J", "sec": "§13.3 Équilibre de Nash", "q": "Dans ce jeu, à l'équilibre en stratégies mixtes, avec quelle probabilité le joueur 2 joue-t-il Gauche&#8239;?", "fig": "<div class=\"fig\"><table class=\"mx\"><tr><td class=\"cp\" colspan=\"2\"></td><th class=\"cp\" colspan=\"2\">Joueur 2</th></tr><tr><td colspan=\"2\"></td><th>Gauche</th><th>Droite</th></tr><tr><th class=\"rp\" rowspan=\"2\">Joueur 1</th><th>Haut</th><td class=\"c\">2&#8239;; 0</td><td class=\"c\">0&#8239;; 3</td></tr><tr><th>Bas</th><td class=\"c\">1&#8239;; 2</td><td class=\"c\">3&#8239;; 1</td></tr></table></div>", "o": ["<span class=\"m\">1/4</span>", "<span class=\"m\">2/5</span>", "<span class=\"m\">1/2</span>", "<span class=\"m\">3/4</span>"], "a": 3, "x": "Le joueur 2 rend le joueur 1 indifférent&#8239;: 2q = q + 3(1 − q), d'où q = 3/4. Le 1/4 est la probabilité de Haut, qui rend le joueur 2 indifférent.", "r": "§13.3, diapo 60"}, {"id": "lc1", "dom": "R", "sec": "Bloc C Attitudes face au risque", "q": "Selon la définition retenue dans le polycopié, un agent a du goût pour le risque s'il", "fig": "", "o": ["préfère une loterie à son espérance certaine", "joue à la loterie tout en s'assurant par ailleurs", "préfère toute loterie à tout revenu certain", "a une utilité marginale décroissante avec la richesse"], "a": 0, "x": "Le polycopié retient la définition symétrique de l'aversion, parmi les deux formulations de P&amp;R.", "r": "Poly. C.2&#8239;; diapo 34"}, {"id": "lb4", "dom": "R", "sec": "Bloc B Choisir face au risque", "q": "Avec <span class=\"m\">u(W) = √W</span>, une loterie donne 100&nbsp;€ (proba. 0,3), 400&nbsp;€ (proba. 0,5) et 900&nbsp;€ (proba. 0,2). Son utilité espérée vaut", "fig": "", "o": ["361", "20", "20,25", "19"], "a": 3, "x": "EU = 0,3 × 10 + 0,5 × 20 + 0,2 × 30 = 3 + 10 + 6 = 19. Le 20,25 est √410, l'utilité de l'espérance.", "r": "Poly. B.5"}, {"id": "L2", "dom": "J", "sec": "§13.2 Stratégies dominantes", "q": "Deux cafés voisins choisissent leur politique. Le Café Pont (en colonne) a-t-il une stratégie dominante&#8239;?", "fig": "<div class=\"fig\"><table class=\"mx\"><tr><td class=\"cp\" colspan=\"2\"></td><th class=\"cp\" colspan=\"2\">Café Pont</th></tr><tr><td colspan=\"2\"></td><th>Ouvert le dimanche</th><th>Fermé le dimanche</th></tr><tr><th class=\"rp\" rowspan=\"2\">Café Rive</th><th>Terrasse</th><td class=\"c\">9&#8239;; 4</td><td class=\"c\">6&#8239;; 7</td></tr><tr><th>Sans terrasse</th><td class=\"c\">7&#8239;; 3</td><td class=\"c\">5&#8239;; 5</td></tr></table></div>", "o": ["Oui, Fermé le dimanche, car 7 &gt; 4 et 5 &gt; 3", "Non, car c'est le Café Rive qui a une stratégie dominante", "Non, car ses comparaisons vont en sens opposés", "Oui, Ouvert le dimanche, car 9 &gt; 6 et 7 &gt; 5"], "a": 0, "x": "Pour le joueur colonne, on compare ses propres gains le long de chaque ligne&#8239;: 7 &gt; 4 si Rive a une terrasse, 5 &gt; 3 sinon. Les chiffres 9, 6, 7, 5 sont ceux du Café Rive.", "r": "§13.2, diapos 31–32"}, {"id": "LN10", "dom": "J", "sec": "§13.3 Équilibre de Nash", "q": "Nora et Tom choisissent seuls la montagne ou la mer. Dans l'équilibre en stratégies mixtes, avec quelle probabilité partent-ils au même endroit&#8239;?", "fig": "<div class=\"fig\"><table class=\"mx\"><tr><td class=\"cp\" colspan=\"2\"></td><th class=\"cp\" colspan=\"2\">Tom</th></tr><tr><td colspan=\"2\"></td><th>Montagne</th><th>Mer</th></tr><tr><th class=\"rp\" rowspan=\"2\">Nora</th><th>Montagne</th><td class=\"c\">4&#8239;; 1</td><td class=\"c\">0&#8239;; 0</td></tr><tr><th>Mer</th><td class=\"c\">0&#8239;; 0</td><td class=\"c\">1&#8239;; 4</td></tr></table></div>", "o": ["<span class=\"m\">4/25</span>", "<span class=\"m\">1/2</span>", "<span class=\"m\">17/25</span>", "<span class=\"m\">8/25</span>"], "a": 3, "x": "Tom rend Nora indifférente&#8239;: 4q = 1 − q, q = 1/5. Nora rend Tom indifférent&#8239;: p = 4(1 − p), p = 4/5. Pr(même lieu) = pq + (1 − p)(1 − q) = 4/25 + 4/25 = 8/25.", "r": "§13.3, diapo 62"}, ": "LN9", "dom": "J", "sec": "§13.3 Équilibre de Nash", "q": "Qu'est-ce qui distingue la bataille des sexes du jeu symétrique du choix de produit&#8239;?", "fig": "", "o": ["Le jeu du choix de produit n'a qu'un seul équilibre de Nash, en stratégies mixtes", "Ses deux équilibres purs ne donnent pas les mêmes gains aux joueurs", "Dans la bataille des sexes, chaque joueur dispose d'une stratégie dominante", "La bataille des sexes n'a aucun équilibre de Nash en stratégies pures"], "a": 1, "x": "Les deux jeux ont deux équilibres purs, mais dans la bataille des sexes la sélection devient un conflit distributif.", "r": "§13.3, diapos 41 et 44"}, {"id": "lc2", "dom": "R", "sec": "Bloc C Attitudes face au risque", "q": "Avec <span class=\"m\">u(W) = √W</span>, un agent est indifférent entre 2&#8239;500&nbsp;€ certains et une loterie qui donne 0&nbsp;€ ou X&nbsp;€ avec probabilité 1/2. Que vaut X&#8239;?", "fig": "", "o": ["100&nbsp;€", "5&#8239;000&nbsp;€", "20&#8239;000&nbsp;€", "10&#8239;000&nbsp;€"], "a": 3, "x": "EU = 0,5√X = √2&#8239;500 = 50, donc √X = 100 et X = 10&#8239;000&nbsp;€. Le 5&#8239;000&nbsp;€ raisonne comme un agent neutre.", "r": "Poly. C.4, formule (C.1)"}, {"id": "L5", "dom": "J", "sec": "§13.2 Stratégies dominantes", "q": "Un profil de stratégies est un équilibre en stratégies dominantes lorsque", "fig": "", "o": ["aucun joueur n'a intérêt à modifier seul sa stratégie", "chaque joueur y joue une stratégie dominante", "il est obtenu après l'élimination d'une stratégie dominée", "au moins un des joueurs y joue une stratégie dominante"], "a": 1, "x": "Il faut une dominante pour chaque joueur. «&#8239;Aucune déviation unilatérale profitable&#8239;» définit l'équilibre de Nash, plus général.", "r": "§13.2, diapo 32"}, {"id": "LR2", "dom": "J", "sec": "§13.4 Jeux répétés", "q": "Stratégie de déclenchement&#8239;: 6 par période en coopérant, 10 pour celui qui trahit, puis 2 par période pour toujours. La punition commence la période suivante. Quel est le seuil de δ au-delà duquel la coopération est soutenable&#8239;?", "fig": "", "o": ["<span class=\"m\">2/5</span>", "<span class=\"m\">3/5</span>", "<span class=\"m\">1/2</span>", "<span class=\"m\">2/3</span>"], "a": 2, "x": "6/(1 − δ) ≥ 10 + 2δ/(1 − δ) ⟺ 6 ≥ 10 − 8δ ⟺ δ ≥ 4/8 = 1/2.", "r": "§13.4, diapo 71"}, {"id": "L3", "dom": "J", "sec": "§13.2 Stratégies dominantes", "q": "Sur quelle hypothèse repose l'élimination itérée des stratégies strictement dominées&#8239;?", "fig": "", "o": ["L'existence d'une stratégie dominante pour chaque joueur dès la matrice initiale", "La connaissance commune de la rationalité des joueurs", "La possibilité pour les joueurs de communiquer et de se coordonner avant de jouer", "Le fait que le jeu soit séquentiel, pour que chacun observe les éliminations de l'autre"], "a": 1, "x": "Retirer une stratégie de l'autre suppose de savoir qu'il est rationnel, puis qu'il sait que je le suis, etc.", "r": "§13.2, diapo 33"}, {"id": "LS2", "dom": "J", "sec": "§1.5 Jeux séquentiels", "q": "Dans un arbre de jeu, que représentent les extrémités (nœuds terminaux)&#8239;?", "fig": "", "o": ["Les gains de chaque joueur pour la suite de coups qui y mène", "Les stratégies mixtes que chaque joueur peut utiliser", "Les actions possibles de chaque joueur à chaque nœud", "Les joueurs qui ont la décision à chaque étape du jeu"], "a": 0, "x": "Nœuds = qui joue&#8239;; branches = actions possibles&#8239;; extrémités = gains.", "r": "§1.5, diapo 84"}, {"id": "LN6", "dom": "J", "sec": "§13.3 Équilibre de Nash", "q": "Avec la matrice Microsoft–Apple, notons <span class=\"m\">μ</span> la probabilité qu'Apple n'investisse pas. Au-delà de quelle valeur de <span class=\"m\">μ</span> Microsoft préfère-t-elle ne pas investir&#8239;?", "fig": "<div class=\"fig\"><table class=\"mx\"><tr><td class=\"cp\" colspan=\"2\"></td><th class=\"cp\" colspan=\"2\">Apple</th></tr><tr><td colspan=\"2\"></td><th>Ne pas investir</th><th>Investir</th></tr><tr><th class=\"rp\" rowspan=\"2\">Microsoft</th><th>Ne pas investir</th><td class=\"c\">0&#8239;; 0</td><td class=\"c\">−10&#8239;; 10</td></tr><tr><th>Investir</th><td class=\"c\">−100&#8239;; 0</td><td class=\"c\">20&#8239;; 10</td></tr></table></div>", "o": ["<span class=\"m\">μ &gt; 3/13 ≈ 0,23</span>", "<span class=\"m\">μ &gt; 1/11 ≈ 0,09</span>", "<span class=\"m\">μ &gt; 1/6 ≈ 0,17</span>", "<span class=\"m\">μ &gt; 1/2</span>"], "a": 0, "x": "E[investir] = 20 − 120μ&#8239;; E[ne pas investir] = −10 + 10μ. L'égalité donne 130μ = 30, soit μ = 3/13, cohérent avec 0,1 (investir) et 0,3 (ne pas investir) vus en cours.", "r": "§13.3, diapo 52"}, {"id": "lb6", "dom": "R", "sec": "Bloc B Choisir face au risque", "q": "Si un dé décide si vous recevez du café, du thé ou de la crème, pourquoi la quantité de crème ne devrait-elle plus peser sur le choix entre café et thé&#8239;?", "fig": "", "o": ["La crème est un bien inférieur, dont la demande baisse avec le revenu", "Le café et le thé sont des substituts parfaits pour la plupart des gens", "Le dé rend les trois résultats équiprobables, donc interchangeables", "Vous n'en recevrez qu'un des trois"], "a": 3, "x": "C'est l'argument de Varian pour l'hypothèse d'indépendance, qui conduit à l'utilité espérée.", "r": "Poly. B.9&#8239;; diapo 27"}, {"id": "LS4", "dom": "J", "sec": "§1.5 Jeux séquentiels", "q": "Avec la matrice du cours (<span class=\"m\">P = 30 − Q</span>, coût marginal nul), de combien le profit de la firme 1 augmente-t-il lorsqu'elle joue en premier plutôt que simultanément&#8239;?", "fig": "<div class=\"fig\"><table class=\"mx\"><tr><td class=\"cp\" colspan=\"2\"></td><th class=\"cp\" colspan=\"3\">Firme 2</th></tr><tr><td colspan=\"2\"></td><th>q<sub>2</sub> = 7,5</th><th>q<sub>2</sub> = 10</th><th>q<sub>2</sub> = 15</th></tr><tr><th class=\"rp\" rowspan=\"3\">Firme 1</th><th>q<sub>1</sub> = 7,5</th><td class=\"c\">112,5&#8239;; 112,5</td><td class=\"c\">93,75&#8239;; 125</td><td class=\"c\">56,25&#8239;; 112,5</td></tr><tr><th>q<sub>1</sub> = 10</th><td class=\"c\">125&#8239;; 93,75</td><td class=\"c\">100&#8239;; 100</td><td class=\"c\">50&#8239;; 75</td></tr><tr><th>q<sub>1</sub> = 15</th><td class=\"c\">112,5&#8239;; 56,25</td><td class=\"c\">75&#8239;; 50</td><td class=\"c\">0&#8239;; 0</td></tr></table></div>", "o": ["56,25", "0", "12,5", "25"], "a": 2, "x": "Simultané&#8239;: Cournot (10&#8239;; 10), profit 100. Premier&#8239;: q<sub>1</sub> = 15, la firme 2 répond 7,5, profit 112,5. Écart&#8239;: 12,5. Le 25 lit la case (10&#8239;; 7,5), qui n'est pas atteinte.", "r": "§1.5, diapo 88"}, {"id": "LR3", "dom": "J", "sec": "§13.4 Jeux répétés", "q": "Pourquoi la punition «&#8239;prix bas pour toujours&#8239;» est-elle crédible dans l'exemple du cours&#8239;?", "fig": "", "o": ["Parce qu'un contrat signé par les deux firmes les oblige à l'appliquer", "Parce que (Bas, Bas) est l'équilibre du jeu de base", "Parce que le facteur d'actualisation des deux firmes est supérieur à 5/9", "Parce qu'elle procure aux deux firmes un gain plus élevé que la coopération"], "a": 1, "x": "Une punition n'est utile que si elle est suffisante et crédible&#8239;; ici elle consiste à rejouer l'équilibre du jeu de base.", "r": "§13.4, diapos 71–72"}, {"id": "lb1", "dom": "R", "sec": "Bloc B Choisir face au risque", "q": "Sur la droite de budget de l'assurance, un point situé à gauche de la dotation (K &lt; 0) correspond", "fig": "", "o": ["à une assurance proposée gratuitement", "à un plan inaccessible avec ce budget", "à vendre de l'assurance", "à une assurance complète, sur la diagonale"], "a": 2, "x": "Les points à droite de la dotation correspondent à K &gt; 0&#8239;; à gauche, l'agent joue le rôle de l'assureur.", "r": "Poly. B.3"}, {"id": "LN5", "dom": "J", "sec": "§13.3 Équilibre de Nash", "q": "Microsoft joue sa stratégie maximin (ne pas investir) et Apple la sienne (investir). Ce profil est-il un équilibre de Nash&#8239;?", "fig": "<div class=\"fig\"><table class=\"mx\"><tr><td class=\"cp\" colspan=\"2\"></td><th class=\"cp\" colspan=\"2\">Apple</th></tr><tr><td colspan=\"2\"></td><th>Ne pas investir</th><th>Investir</th></tr><tr><th class=\"rp\" rowspan=\"2\">Microsoft</th><th>Ne pas investir</th><td class=\"c\">0&#8239;; 0</td><td class=\"c\">−10&#8239;; 10</td></tr><tr><th>Investir</th><td class=\"c\">−100&#8239;; 0</td><td class=\"c\">20&#8239;; 10</td></tr></table></div>", "o": ["Non&#8239;: sachant qu'Apple investit, Microsoft gagnerait 20 au lieu de −10", "Oui, car chacun y maximise son gain minimum, ce qui exclut toute déviation profitable", "Non, car Apple gagnerait davantage en n'investissant pas, puisque 0 &gt; −10", "Oui, car Apple y joue sa stratégie dominante et Microsoft sa stratégie prudente"], "a": 0, "x": "Le maximin n'est pas un équilibre&#8239;: Microsoft a une déviation profitable. Apple, elle, joue bien sa meilleure réponse (10 &gt; 0).", "r": "§13.3, diapos 49–50"}, {"id": "la7", "dom": "R", "sec": "Bloc A Décrire le risque", "q": "Deux issues sont séparées de 2&#8239;000&nbsp;€. Comment évolue l'écart-type quand π<sub>1</sub> passe de 0,2 à 0,5&#8239;?", "fig": "", "o": ["Il passe de 800&nbsp;€ à 500&nbsp;€", "Il passe de 400&nbsp;€ à 1&#8239;000&nbsp;€", "Il ne change pas, car l'écart entre les issues est le même", "Il passe de 800&nbsp;€ à 1&#8239;000&nbsp;€"], "a": 3, "x": "σ = √(π<sub>1</sub>π<sub>2</sub>) × 2&#8239;000&#8239;: √0,16 × 2&#8239;000 = 800&nbsp;€, puis √0,25 × 2&#8239;000 = 1&#8239;000&nbsp;€. Le risque est maximal pour des issues équiprobables.", "r": "Poly. A.7, formule (A.9)"}, {"id": "L4", "dom": "J", "sec": "§13.2 Stratégies dominantes", "q": "Ana n'a pas de stratégie dominante, Ben en a une. Quelle issue prévoit-on&#8239;?", "fig": "<div class=\"fig\"><table class=\"mx\"><tr><td class=\"cp\" colspan=\"2\"></td><th class=\"cp\" colspan=\"2\">Ben</th></tr><tr><td colspan=\"2\"></td><th>B1</th><th>B2</th></tr><tr><th class=\"rp\" rowspan=\"2\">Ana</th><th>A1</th><td class=\"c\">6&#8239;; 2</td><td class=\"c\">2&#8239;; 5</td></tr><tr><th>A2</th><td class=\"c\">3&#8239;; 1</td><td class=\"c\">4&#8239;; 3</td></tr></table></div>", "o": ["(A1, B2)", "(A1, B1)", "Aucune prévision n'est possible sans stratégie dominante pour les deux joueurs", "(A2, B2)"], "a": 3, "x": "Ben&#8239;: 5 &gt; 2 et 3 &gt; 1, B2 domine. Ana, se mettant à sa place, anticipe B2 et choisit A2 (4 &gt; 2).", "r": "§13.2, diapo 36"}, {"id": "LR6", "dom": "J", "sec": "§13.4 Jeux répétés", "q": "Une firme sait qu'elle quittera le marché à une date que sa rivale ignore. Cette situation relève", "fig": "", "o": ["de l'incertitude commune, comme un horizon aléatoire dont la loi est connue de tous", "de l'information incomplète&#8239;: sa date de sortie est un type privé", "d'un jeu coopératif, car la date de sortie de la firme est fixée à l'avance", "d'un horizon fini connu, qui déclenche le détricotage dès la première période"], "a": 1, "x": "Le cours distingue la date de fin aléatoire connue de tous (incertitude symétrique) de la date connue d'un seul joueur (information privée, chapitre 3).", "r": "§13.4, diapo 78"}, {"id": "LS1", "dom": "J", "sec": "§1.5 Jeux séquentiels", "q": "Les gains ci-dessous valent quel que soit l'ordre des coups, et le second joueur observe le coup du premier. Comparez le gain de A selon qu'il joue en premier ou en second.", "fig": "<div class=\"fig\"><table class=\"mx\"><tr><td class=\"cp\" colspan=\"2\"></td><th class=\"cp\" colspan=\"2\">B</th></tr><tr><td colspan=\"2\"></td><th>g</th><th>d</th></tr><tr><th class=\"rp\" rowspan=\"2\">A</th><th>Haut</th><td class=\"c\">3&#8239;; 0</td><td class=\"c\">1&#8239;; 2</td></tr><tr><th>Bas</th><td class=\"c\">0&#8239;; 3</td><td class=\"c\">2&#8239;; 1</td></tr></table></div>", "o": ["A obtient 2 en premier et 1 en second&#8239;: jouer en premier est un avantage", "A obtient 1 dans les deux cas", "A obtient 1 en premier et 2 en second&#8239;: jouer en second est un avantage", "A obtient 3 en premier, son gain maximal"], "a": 2, "x": "A premier&#8239;: B répond d à Haut et g à Bas, A obtient 1 ou 0, choisit Haut (1). B premier&#8239;: A répond Haut à g et Bas à d, B obtient 0 ou 1, choisit d, et A obtient 2.", "r": "§1.5, diapo 87"}, {"id": "lc10", "dom": "R", "sec": "Bloc C Attitudes face au risque", "q": "Une salariée gagne 18&#8239;000&nbsp;€ de façon certaine. Une offre rapporterait 10&#8239;000&nbsp;€ ou 30&#8239;000&nbsp;€ avec probabilité 1/2. Son utilité est donnée par le tableau. Accepte-t-elle l'offre&#8239;?", "fig": "<div class=\"fig\"><table class=\"tb\"><tr><th>Revenu (milliers d'euros)</th><th>10</th><th>18</th><th>20</th><th>30</th></tr><tr><td>Utilité</td><td>10</td><td>15</td><td>16</td><td>18</td></tr></table></div>", "o": ["Non&#8239;: EU = 14 &lt; u(18) = 15", "Oui&#8239;: son revenu espéré, 20&#8239;000&nbsp;€, dépasse 18&#8239;000&nbsp;€", "Non, car un agent averse au risque refuse toute loterie", "Oui&#8239;: EU = 14 &gt; u(10) = 10, l'utilité de son pire revenu"], "a": 0, "x": "EU = (10 + 18)/2 = 14 &lt; u(18) = 15. Le supplément d'espérance de 2&#8239;000&nbsp;€ ne suffit pas à rémunérer le risque pour elle.", "r": "Poly. C.1&#8239;; diapo 33"}, {"id": "la2", "dom": "R", "sec": "Bloc A Décrire le risque", "q": "Une action vaudra 90&nbsp;€ avec probabilité 0,4 et 40&nbsp;€ sinon. Un investisseur neutre au risque l'achète-t-il au prix de 62&nbsp;€&#8239;?", "fig": "", "o": ["Non&#8239;: sa valeur la plus probable, 40&nbsp;€, est inférieure au prix", "Oui&#8239;: son espérance, 65&nbsp;€, dépasse le prix", "Oui, car le gain possible (28&nbsp;€) dépasse la perte possible (22&nbsp;€)", "Non&#8239;: son espérance, 60&nbsp;€, est inférieure au prix"], "a": 3, "x": "E = 0,4 × 90 + 0,6 × 40 = 36 + 24 = 60&nbsp;€ &lt; 62&nbsp;€. Le 65&nbsp;€ suppose à tort des probabilités 1/2.", "r": "Poly. A.3 et exemple alternatif 1.1"}, {"id": "LN8", "dom": "J", "sec": "§13.3 Équilibre de Nash", "q": "L'équilibre de Nash du dilemme du prisonnier n'est pas Pareto-optimal. Cela signifie que", "fig": "", "o": ["une autre issue améliore strictement la situation des deux joueurs", "la somme des gains des deux joueurs y est négative, donc inférieure à zéro", "les joueurs n'y jouent pas leur stratégie dominante, faute de coordination", "l'un des joueurs pourrait améliorer son gain en déviant seul de cet équilibre"], "a": 0, "x": "(Se taire, Se taire) donne −2 à chacun contre −5&#8239;: mieux pour les deux. Une déviation unilatérale profitable contredirait la définition de Nash.", "r": "§13.3, diapo 54"}, {"id": "LR4", "dom": "J", "sec": "§13.4 Jeux répétés", "q": "D'après la grille de lecture du cours, quelle situation rend la coopération tacite plus difficile&#8239;?", "fig": "", "o": ["Une demande très fluctuante, qui brouille ce qu'est un prix «&#8239;coopératif&#8239;»", "Un gain immédiat de déviation faible par rapport au profit de coopération", "Des relations durables entre les mêmes firmes, qui se connaissent depuis longtemps", "Des barrières à l'entrée importantes, qui protègent les firmes en place"], "a": 0, "x": "La coopération est plus facile si δ est élevé, la déviation détectable, le gain immédiat limité et le comportement coopératif identifiable malgré les chocs (compteurs d'eau contre transport aérien).", "r": "§13.4, diapos 79–80"}, {"id": "lc3", "dom": "R", "sec": "Bloc C Attitudes face au risque", "q": "Une agente a une prime de risque de −150&nbsp;€ pour une loterie. Cela signifie", "fig": "", "o": ["qu'elle paierait jusqu'à 150&nbsp;€ pour se débarrasser du risque", "qu'elle est neutre au risque, mais que la loterie est défavorable", "que son équivalent certain est inférieur de 150&nbsp;€ à l'espérance", "que son équivalent certain dépasse l'espérance de 150&nbsp;€"], "a": 3, "x": "ρ = E[W] − EC &lt; 0, donc EC &gt; E[W]&#8239;: elle aime le risque.", "r": "Poly. C.4 et C.7&#8239;; diapo 39"}, {"id": "LN2", "dom": "J", "sec": "§13.3 Équilibre de Nash", "q": "Pourquoi, dans un équilibre en stratégies mixtes, chaque joueur doit-il être indifférent entre les stratégies pures qu'il mélange&#8239;?", "fig": "", "o": ["Parce que les gains espérés des deux joueurs doivent être égaux à l'équilibre", "Parce que chaque joueur doit jouer chacune de ses stratégies avec la même probabilité", "Sinon, il jouerait avec certitude la pure qui rapporte le plus", "Parce que le théorème de Nash impose des gains espérés nuls dans tout équilibre mixte"], "a": 2, "x": "Principe d'indifférence&#8239;: si une pure rapportait strictement plus, mélanger ne serait pas optimal.", "r": "§13.3, diapo 60"}, {"id": "L1", "dom": "J", "sec": "§13.2 Stratégies dominantes", "q": "La stratégie Haut domine faiblement la stratégie Bas pour le joueur 1 si", "fig": "", "o": ["Haut rapporte plus que Bas en moyenne, en pondérant également les stratégies de l'autre", "Haut rapporte au moins autant que Bas partout, et strictement plus dans au moins un cas", "Haut rapporte strictement plus que Bas contre chacune des stratégies de l'autre joueur", "Haut rapporte plus que Bas contre la stratégie que l'autre joueur joue le plus probablement"], "a": 1, "x": "Dominance faible&#8239;: «&#8239;au moins aussi bonne partout, strictement meilleure quelque part&#8239;». La première distractrice définit la dominance stricte.", "r": "§13.2, diapos 32–34"}, {"id": "la8", "dom": "R", "sec": "Bloc A Décrire le risque", "q": "Pourquoi le cours mesure-t-il le risque par l'écart-type plutôt que par la variance&#8239;?", "fig": "", "o": ["L'écart-type s'exprime dans la même unité que les issues", "La variance est toujours nulle, car les écarts se compensent", "L'écart-type pèse davantage sur les grands écarts que la variance", "La variance ne permet pas de classer deux loteries entre elles"], "a": 0, "x": "La variance est en «&#8239;euros au carré&#8239;», sans sens concret&#8239;; elle reste utile dans les calculs.", "r": "Poly. A.5&#8239;; diapo 10"}, {"id": "LN11", "dom": "J", "sec": "§13.3 Équilibre de Nash", "q": "Dans le duopole de Cournot du cours (<span class=\"m\">P = 30 − Q</span>, coût marginal nul), la meilleure réponse de la firme 1 est <span class=\"m\">q<sub>1</sub> = 15 − q<sub>2</sub>/2</span>. Si la firme 2 produit 6, combien produit la firme 1&#8239;?", "fig": "", "o": ["9", "12", "24", "10"], "a": 1, "x": "q<sub>1</sub> = 15 − 6/2 = 12. Le 10 est la quantité d'équilibre, qui n'est la meilleure réponse que si q<sub>2</sub> = 10.", "r": "§13.3, diapo 48"}, {"id": "lb5", "dom": "R", "sec": "Bloc B Choisir face au risque", "q": "Loterie&#8239;: 0&nbsp;€ ou 400&nbsp;€ avec probabilité 1/2, contre 150&nbsp;€ certains. Que choisit un agent d'utilité u = √W, puis un agent d'utilité w = W²&#8239;?", "fig": "", "o": ["La loterie avec √W, le montant certain avec W²", "Le montant certain dans les deux cas, car W² est une transformation croissante de √W", "La loterie dans les deux cas, car son espérance (200&nbsp;€) dépasse 150&nbsp;€", "Le montant certain avec √W, la loterie avec W²"], "a": 3, "x": "√W&#8239;: EU = 10 &lt; √150 ≈ 12,25. W²&#8239;: EU = 80&#8239;000 &gt; 22&#8239;500. W² = (√W)⁴ est croissante mais pas affine&#8239;: le classement s'inverse.", "r": "Poly. B.8&#8239;; diapo 26"}, {"id": "lb8", "dom": "R", "sec": "Bloc B Choisir face au risque", "q": "Pourquoi Varian écrit-il l'utilité sous la forme u(c<sub>1</sub>, c<sub>2</sub>, π<sub>1</sub>, π<sub>2</sub>)&#8239;?", "fig": "", "o": ["La valeur d'un euro dans un état dépend de la probabilité de cet état", "L'agent choisit lui-même les probabilités des états de la nature", "L'agent est neutre au risque, donc seules les probabilités comptent", "Les consommations des deux états sont consommées ensemble, comme café et crème"], "a": 0, "x": "On cède volontiers un euro dans un état très improbable&#8239;: les probabilités entrent dans les préférences.", "r": "Poly. B.4&#8239;; diapo 21"}, {"id": "lc6", "dom": "R", "sec": "Bloc C Attitudes face au risque", "q": "Pourquoi l'aversion au risque laisse-t-elle une marge à l'assureur&#8239;?", "fig": "", "o": ["La prime de risque de l'assuré est prise en charge par l'État", "L'assuré sous-estime presque toujours sa probabilité de sinistre", "L'assuré paie volontiers plus que sa perte espérée", "L'assureur est lui-même averse au risque et exige une marge"], "a": 2, "x": "Pour Inès, un agent neutre paierait 640&nbsp;€&#8239;; l'aversion ajoute 144&nbsp;€, soit 784&nbsp;€ au plus.", "r": "Poly. C.8&#8239;; diapo 40"}, {"id": "la9", "dom": "R", "sec": "Bloc A Décrire le risque", "q": "Le cours retient les carrés des écarts plutôt que leurs valeurs absolues. Pour quelles raisons&#8239;?", "fig": "", "o": ["Les valeurs absolues des écarts ont toujours une moyenne pondérée nulle", "Les valeurs absolues ne permettent jamais de comparer deux loteries", "Les carrés conservent le signe des écarts, donc leur sens", "Ils pèsent plus sur les grands écarts et se prêtent mieux au calcul"], "a": 3, "x": "Avec les valeurs absolues, le classement des deux emplois serait le même&#8239;; mais la variance d'une somme s'écrit simplement, ce que les valeurs absolues ne permettent pas.", "r": "Poly. A.5"}, {"id": "la6", "dom": "R", "sec": "Bloc A Décrire le risque", "q": "Deux investisseurs retiennent des probabilités de succès différentes pour un même forage, dans une zone jamais explorée. D'après le cours,", "fig": "", "o": ["l'un des deux se trompe nécessairement, car la probabilité est une propriété du gisement", "c'est possible&#8239;: ce sont des probabilités subjectives", "aucune analyse n'est possible sans probabilité objective fondée sur des fréquences", "il faut retenir la moyenne des deux probabilités, seule valeur objective"], "a": 1, "x": "Sans fréquence observée, la probabilité traduit un jugement&#8239;; seuls comptent les nombres que chaque agent utilise.", "r": "Poly. A.2&#8239;; diapo 7"}, {"id": "lc9", "dom": "R", "sec": "Bloc C Attitudes face au risque", "q": "L'inégalité E[u(W)] ≤ u(E[W]) pour u concave", "fig": "", "o": ["ne vaut que si la fonction u est linéaire", "ne vaut que pour deux issues équiprobables", "vaut pour un nombre quelconque d'issues", "s'inverse dès qu'il y a plus de deux issues"], "a": 2, "x": "Le polycopié la démontre pour deux issues et l'énonce en général comme l'inégalité de Jensen.", "r": "Poly. C.3"}, {"id": "lb7", "dom": "R", "sec": "Bloc B Choisir face au risque", "q": "À sa dotation, le TMS d'Inès vaut 0,185, alors que le prix relatif γ/(1 − γ) vaut 1/9 ≈ 0,111. Qu'en déduit-on&#8239;?", "fig": "", "o": ["Elle est déjà à son optimum, puisque les deux nombres sont positifs", "Elle gagne à acheter de l'assurance", "On ne peut rien conclure sans connaître son équivalent certain", "Elle gagne à vendre de l'assurance, car son TMS dépasse le prix relatif"], "a": 1, "x": "Le TMS mesure ce qu'elle céderait dans l'état 2 pour un euro de plus dans l'état 1&#8239;; il dépasse ce que demande l'assureur, donc la première unité de couverture l'améliore.", "r": "Poly. B.6–B.7&#8239;; diapos 24–25"}, {"id": "LS3", "dom": "J", "sec": "§1.5 Jeux séquentiels", "q": "Dans le duopole de Stackelberg du cours, la firme 1 annonce q<sub>1</sub> = 15 mais peut revenir sur sa quantité après avoir vu celle de la firme 2. Que se passe-t-il&#8239;?", "fig": "", "o": ["Le jeu devient coopératif, car les firmes communiquent", "La firme 1 conserve son avantage, puisqu'elle a annoncé la première", "L'avantage disparaît&#8239;: l'annonce n'engage à rien", "La firme 2 réduit sa production pour éviter une guerre de prix"], "a": 2, "x": "Sans engagement irréversible, l'annonce n'est pas crédible et l'avantage disparaît entièrement.", "r": "§1.5, diapo 89"}, {"id": "lc4", "dom": "R", "sec": "Bloc C Attitudes face au risque", "q": "Sans sinistre, Omar a 50&#8239;000&nbsp;€&#8239;; sa perte espérée est de 3&#8239;000&nbsp;€ et l'équivalent certain de sa situation est de 46&#8239;500&nbsp;€. Prime maximale pour une assurance complète, et prime de risque&#8239;?", "fig": "", "o": ["3&#8239;000&nbsp;€ et 500&nbsp;€", "500&nbsp;€ et 3&#8239;500&nbsp;€", "3&#8239;500&nbsp;€ et 3&#8239;000&nbsp;€", "3&#8239;500&nbsp;€ et 500&nbsp;€"], "a": 3, "x": "Pmax = 50&#8239;000 − 46&#8239;500 = 3&#8239;500&nbsp;€&#8239;; E[W] = 47&#8239;000&nbsp;€, ρ = 47&#8239;000 − 46&#8239;500 = 500&nbsp;€. On retrouve 3&#8239;500 = 3&#8239;000 + 500.", "r": "Poly. C.8, formule (C.3)&#8239;; diapo 40"}, {"id": "lc8", "dom": "R", "sec": "Bloc C Attitudes face au risque", "q": "Si la fonction d'utilité d'un agent devient plus concave, l'équivalent certain d'une loterie donnée", "fig": "", "o": ["augmente, et sa prime de risque augmente", "diminue, et sa prime de risque augmente", "ne change pas, car l'espérance ne change pas", "diminue, et sa prime de risque diminue"], "a": 1, "x": "Plus u est concave, plus l'aversion est forte&#8239;; ρ = E[W] − EC croît quand EC baisse, l'espérance étant fixe.", "r": "Poly. C.3–C.4 et C.10"}, {"id": "lb3", "dom": "R", "sec": "Bloc B Choisir face au risque", "q": "La Cobb-Douglas <span class=\"m\">u = c<sub>1</sub><sup>π</sup> c<sub>2</sub><sup>1−π</sup></span>", "fig": "", "o": ["décrit un agent neutre au risque, car ses exposants somment à 1", "a elle-même la forme d'utilité espérée, avec la fonction u(c) = c", "ne dépend pas des probabilités des états, seulement des consommations", "représente des préférences d'utilité espérée, sans en avoir elle-même la forme"], "a": 3, "x": "Son logarithme s'écrit Σπ<sub>s</sub> ln c<sub>s</sub>. Une transformation croissante de U préserve les préférences mais peut faire perdre la forme (B.4).", "r": "Poly. B.4–B.5 et B.8"}, {"id": "LN12", "dom": "J", "sec": "§13.3 Équilibre de Nash", "q": "Dans quel cas randomiser a-t-il un sens pour une entreprise ou une administration&#8239;?", "fig": "", "o": ["Jamais&#8239;: une stratégie mixte n'est qu'un artifice mathématique sans interprétation", "Quand le jeu a un unique équilibre de Nash en stratégies pures, pour s'en écarter", "Quand être prévisible est coûteux, comme pour des contrôles de billets", "Quand elle dispose d'une stratégie dominante qu'elle veut dissimuler à ses rivaux"], "a": 2, "x": "Le cours donne deux lectures, littérale (contrôles, audits) et en proportions de population, tout en notant la fragilité de l'équilibre mixte.", "r": "§13.3, diapo 63"}, {"id": "lb9", "dom": "R", "sec": "Bloc B Choisir face au risque", "q": "Avec <span class=\"m\">u(W) = √W</span>, Zoé a 900&nbsp;€ avec probabilité 0,2 et 3&#8239;600&nbsp;€ sinon. Préfère-t-elle 2&#8239;900&nbsp;€ certains&#8239;?", "fig": "", "o": ["Oui, car un agent d'utilité √W préfère toujours un montant certain", "Non&#8239;: EU = 54 &gt; √2&#8239;900 ≈ 53,85, elle garde la loterie", "Oui&#8239;: 2&#8239;900&nbsp;€ est proche de l'espérance, 3&#8239;060&nbsp;€", "Oui&#8239;: EU = 45 &lt; √2&#8239;900 ≈ 53,85"], "a": 1, "x": "EU = 0,2 × 30 + 0,8 × 60 = 54. Le 45 ne pondère pas les utilités. Un agent averse peut garder un risque si le montant certain est assez bas.", "r": "Poly. B.5 et B.10"}, {"id": "la5", "dom": "R", "sec": "Bloc A Décrire le risque", "q": "On convertit toutes les issues d'une loterie de dollars en euros, en les multipliant par 0,9. Sa variance est", "fig": "", "o": ["inchangée, car les probabilités ne changent pas", "multipliée par 1,8", "multipliée par 0,81", "multipliée par 0,9"], "a": 2, "x": "Var(bW) = b²Var(W) = 0,81 Var(W). L'écart-type, lui, est multiplié par 0,9.", "r": "Poly. A.5, formule (A.7)"}, {"id": "lc5", "dom": "R", "sec": "Bloc C Attitudes face au risque", "q": "Un agent a u(0) = 0, u(10) = 7 et u(20) = 10. Face à la loterie 0&nbsp;€ ou 20&nbsp;€ avec probabilité 1/2, il est", "fig": "", "o": ["impossible à classer sans la formule de u", "averse au risque, car EU = 5 &lt; u(10) = 7", "neutre au risque, car l'espérance vaut 10", "amateur de risque, car u(20) = 10 &gt; u(10) = 7"], "a": 1, "x": "On compare l'utilité espérée de la loterie, 5, à l'utilité de son espérance certaine, 7.", "r": "Poly. C.2&#8239;; diapo 34"}, {"id": "la10", "dom": "R", "sec": "Bloc A Décrire le risque", "q": "Emploi 1&#8239;: revenus de 1&#8239;000 à 2&#8239;000 <span class=\"m\"> par pas de 100 (onze issues équiprobables). Emploi 2 : de 1&#8239;300 à 1&#8239;700 </span> (cinq issues équiprobables). Que peut-on dire&#8239;?", "fig": "", "o": ["Même écart-type, car les deux distributions sont symétriques", "L'emploi 1 a une espérance plus élevée, car il va jusqu'à 2&#8239;000 $", "L'emploi 2 est plus risqué, car chacune de ses issues est plus probable (0,2 contre 1/11)", "Même espérance, 1&#8239;500 $, mais l'emploi 1 est plus risqué (σ ≈ 316 contre 141)"], "a": 3, "x": "Les deux distributions sont symétriques autour de 1&#8239;500&#8239;; l'emploi 1, plus étalé, a un écart-type plus grand.", "r": "Poly. A.6&#8239;; diapo 11"}, {"id": "LN1", "dom": "J", "sec": "§13.3 Équilibre de Nash", "q": "Une stratégie mixte est", "fig": "", "o": ["une loi de probabilité sur l'ensemble des stratégies pures du joueur", "une combinaison des stratégies des deux joueurs", "une stratégie qui change d'une période à l'autre dans un jeu répété", "une stratégie qui est meilleure réponse à plusieurs stratégies de l'adversaire"], "a": 0, "x": "Le joueur randomise son choix entre ses stratégies pures&#8239;; une stratégie pure choisit une action avec certitude.", "r": "§13.3, diapo 59"}, {"id": "LR5", "dom": "J", "sec": "§13.4 Jeux répétés", "q": "Après chaque période, la relation continue avec la probabilité ρ = 0,95&#8239;; le taux d'actualisation est r = 0,10. Quel est le poids effectif δ de la période suivante&#8239;?", "fig": "", "o": ["<span class=\"m\">δ = 0,95</span>", "<span class=\"m\">δ = 20</span>", "<span class=\"m\">δ ≈ 0,86</span>", "<span class=\"m\">δ ≈ 1,05</span>"], "a": 2, "x": "δ = ρ/(1 + r) = 0,95/1,10 ≈ 0,86. Le 20 est la durée espérée 1/(1 − ρ), pas un facteur d'actualisation.", "r": "§13.4, diapo 75"}];
const LET = ["a","b","c","d"];
const DOM = {J:"Théorie des jeux (séances II à IV)", R:"Risque et incertitude (séances V–VI, blocs A à C)"};
let order = [], pos = 0, answers = [];
const app = document.getElementById("app");

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fr(x, d){ return x.toFixed(d).replace(".", ","); }

function intro(){
  app.innerHTML = `<div class="card intro">
    <p><strong>${DATA.length} questions</strong>, une seule bonne réponse par question, présentées dans un ordre aléatoire à chaque tentative.</p>
    <ul>
      <li>${DATA.filter(q=>q.dom==="J").length} questions de théorie des jeux et ${DATA.filter(q=>q.dom==="R").length} questions sur le risque, mélangées.</li>
      <li>Après chaque réponse, la correction et une explication s'affichent.</li>
      <li>À la fin : note sur 20 et score par partie.</li>
    </ul>
    <div class="actions"><button class="btn" id="go">Commencer</button></div></div>`;
  document.getElementById("go").onclick = start;
}

function start(){
  order = shuffle(DATA.map((_,i)=>i)); pos = 0; answers = [];
  show();
}

function show(){
  const q = DATA[order[pos]];
  app.innerHTML = `<div class="card">
    <div class="meta"><span>Question ${pos+1} / ${DATA.length}</span><span class="tag">${q.dom==="J"?"Jeux":"Risque"}</span></div>
    <div class="bar"><span style="width:${100*pos/DATA.length}%"></span></div>
    <div class="qtext">${q.q}</div>
    ${q.fig||""}
    <div class="opts">${q.o.map((t,i)=>`<button class="opt" data-i="${i}"><span class="l">${LET[i]})</span><span>${t}</span></button>`).join("")}</div>
    <div id="fb"></div>
  </div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(+b.dataset.i));
  window.scrollTo({top:0, behavior:"smooth"});
}

function choose(i){
  const q = DATA[order[pos]];
  const ok = i === q.a;
  answers.push({id:q.id, dom:q.dom, sec:q.sec, ok});
  app.querySelectorAll(".opt").forEach((b,k)=>{
    b.disabled = true;
    if(k===q.a) b.classList.add("good");
    if(k===i && !ok) b.classList.add("bad");
  });
  const last = pos === DATA.length - 1;
  document.getElementById("fb").innerHTML = `<div class="fb ${ok?"":"ko"}">
      <strong>${ok ? "Bonne réponse." : "Mauvaise réponse. La bonne réponse est " + LET[q.a] + ") " + q.o[q.a] + "."}</strong>
      ${q.x}<div class="ref">${q.r}</div></div>
    <div class="actions"><button class="btn" id="next">${last ? "Voir mon résultat" : "Question suivante"}</button></div>`;
  document.getElementById("next").onclick = () => { if(last) result(); else { pos++; show(); } };
  document.getElementById("next").focus({preventScroll:true});
}

function result(){
  const n = answers.length, good = answers.filter(a=>a.ok).length;
  const byDom = d => { const s = answers.filter(a=>a.dom===d); return [s.filter(a=>a.ok).length, s.length]; };
  const secs = [...new Set(DATA.map(q=>q.sec))];
  const rowsSec = secs.map(s => { const t = answers.filter(a=>a.sec===s); return `<tr><td>${s}</td><td class="n">${t.filter(a=>a.ok).length} / ${t.length}</td></tr>`; }).join("");
  const [gj,nj] = byDom("J"), [gr,nr] = byDom("R");
  app.innerHTML = `<div class="card res">
    <div class="meta"><span>Résultat</span><span>${good} bonnes réponses sur ${n}</span></div>
    <div class="score">${fr(20*good/n,1)} / 20</div>
    <table>
      <tr><th>Partie</th><th class="n">Score</th></tr>
      <tr><td>${DOM.J}</td><td class="n">${gj} / ${nj} · ${fr(20*gj/nj,1)}/20</td></tr>
      <tr><td>${DOM.R}</td><td class="n">${gr} / ${nr} · ${fr(20*gr/nr,1)}/20</td></tr>
    </table>
    <table>
      <tr><th>Détail par section</th><th class="n">Score</th></tr>
      ${rowsSec}
    </table>
    <div class="actions"><button class="btn alt" id="again">Recommencer</button></div>
  </div>`;
  document.getElementById("again").onclick = start;
  window.scrollTo({top:0, behavior:"smooth"});
}

intro();
</script>
</body>
</html>
