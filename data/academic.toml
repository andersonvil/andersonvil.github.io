  ["Number of children", "0.35 (0.69)", "0.24 (0.62)", "0.36 (0.70)", "0.00 (0.00)", "1.55 (0.50)"],
  ["Observations", "1,270", "196", "1,074", "987", "283"]
]
findings = "In the quadratic benchmark, a $10 higher hourly wage raises annual hours by roughly 207–328 for working childless women across wage quartiles, while $1,000 more net resources lowers hours by about 26.5–29.3; mothers show stronger wage and weaker resource responses. The child-cost slope implies about 497 childcare hours per year for one child, compared with a 389-hour ATUS benchmark. Median annual total cost is $21,000 for working mothers and $31,000 for nonworking mothers. Across mothers it is $25,700, with model-based medians of $12,200 for time and $14,200 for goods and services; these are descriptive structural estimates, not compensation recommendations."
limitations = "The general identification result requires curvature and precise second derivatives, which are difficult to estimate in standard microdata; the manuscript finds resource responses only moderately nonlinear. Functional-form restrictions therefore do substantial work in the application. For nonparticipants, the price of time comes from an estimated reservation wage and can be sensitive to the inversion. The primitive time and monetary cost functions are not separately identified even when total cost and economically meaningful decompositions can be recovered."

