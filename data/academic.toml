[[papers]]
id = "household-demand-leisure"
title = "The Household Demand for Leisure, the Price of Time and the Full Cost of Children: A Structural Model and Evidence from the PSID"
short_title = "The Household Demand for Leisure and the Full Cost of Children"
authors = ["Olivier Donni", "Anderson Vil"]
author_line = "Olivier Donni and Anderson Vil"
card_author_line = "with Olivier Donni"
version = "September 18, 2026"
series = "PSE Working Paper No. 2025-38"
job_market = true
publicationStatus = "blocked"
status_label = "Editorial status pending final verification"
url = "/research/household-demand-leisure/"
pdf = "/files/demo/household-demand-leisure-preview.pdf"
description = "A structural model that estimates the productive value of parental childcare time rather than assuming that it equals the market wage."
abstract = "We propose a new approach to estimating the full cost of children—the sum of monetary and time costs—by endogenizing the price of parental time rather than assuming it equals the wage. A simplified collective model of leisure demand for working couples, estimated with 2019 PSID data, recovers the price of parental time and the full cost of children. The results indicate that childcare time combines labor-like and leisure-like components and that a substantial portion of the full cost is non-monetary."
question = "How should parental childcare time be valued when it is partly productive and partly experienced as leisure?"
contribution = "The paper endogenizes the price of parental childcare time using substitution between parental care and purchased childcare, then connects that price to the monetary and time components of child costs."
methods = "Collective household model; childcare technology; full-leisure demand; recursive maximum likelihood and 3SLS; 2019 PSID dual-earner couples."
findings = "The most robust contribution is methodological: the productive price of childcare time can differ materially from the wage. Monetary and full-cost estimates are more fragile and remain in the detailed manuscript rather than the preview headline."
limitations = "The supplied version focuses on dual-earner couples with young children. Full-leisure Engel curves are comparatively flat, and the monetary component is less precisely identified."

[[papers]]
id = "children-costs-one-adult-household"
title = "Children Costs in a One-Adult Household: Empirical Evidence from the UK"
short_title = "Children Costs in a One-Adult Household"
authors = ["Anderson Vil"]
author_line = "Anderson Vil"
card_author_line = "Anderson Vil"
version = "January 12, 2026"
series = "PSE Working Paper No. 2025-37"
job_market = false
publicationStatus = "blocked"
status_label = "Editorial status pending final verification"
url = "/research/children-costs-one-adult-household/"
pdf = "/files/demo/children-costs-one-adult-household-preview.pdf"
description = "A collective consumption model for studying resource sharing and economies of scale in one-adult households with children."
abstract = "This paper asks whether child-cost estimates derived from two-parent households are informative for single-parent families and whether estimated allocation patterns are consistent with benefit rules that condition support uniformly on family size. It develops a collective consumption model for one-adult households and applies it to UK expenditure surveys. The results support the couple-based benchmark for single mothers and find no systematic per-child resource dilution once estimation uncertainty is accounted for."
question = "Can estimates derived from couple households provide useful benchmarks for single-parent families?"
contribution = "The paper extends collective-consumption methods to one-adult households and estimates resource shares using UK expenditure surveys spanning 1978–2022."
methods = "Assignable goods; nonlinear Engel curves; sharing rules and Barten scales; harmonized FES, EFS, and LCF expenditure data."
findings = "The supplied manuscript finds that estimates for single mothers are close to a couple-based reference and does not find systematic per-child dilution once uncertainty is taken into account."
limitations = "The preview omits internally conflicting test statistics and makes no causal claim about the UK two-child limit. Differences between mothers and fathers are not presented as statistically established."

[[papers]]
id = "children-labor-supply-equations"
title = "How to Incorporate Children into Labor Supply Equations? An Equivalence-Scale Approach"
short_title = "Children in Labor Supply Equations"
authors = ["Olivier Donni", "Anderson Vil"]
author_line = "Olivier Donni and Anderson Vil"
card_author_line = "with Olivier Donni"
version = "September 4, 2026"
series = "PSE Working Paper No. 2025-40"
job_market = false
publicationStatus = "blocked"
status_label = "Editorial status pending final verification"
url = "/research/children-labor-supply-equations/"
pdf = "/files/demo/children-labor-supply-equations-preview.pdf"
description = "A framework that represents children's monetary and time channels directly in labor-supply equations."
abstract = "We propose a method for modelling the impact of children on labor supply that jointly considers their time and monetary costs. Restrictions on childcare technology identify the total cost of children from labor-supply equations with modest data requirements. Applied to single mothers in the 2019 PSID, the model suggests that wage responsiveness is higher for women with children, while the reverse holds for exogenous income, and it recovers childcare time and total child costs."
question = "How can children enter labor-supply models as economic mechanisms rather than as a demographic control?"
contribution = "The paper connects equivalence scales, childcare technology, and labor supply so that monetary and time costs can be identified with modest data requirements."
methods = "Static labor-supply model; simplified childcare technology; participation correction; 2019 PSID sample of single women."
findings = "The model predicts that children can change labor-supply responses to wages and exogenous income through distinct time and monetary channels."
limitations = "The supplied PDF contains title and metadata typographical errors. Valuing nonparticipants' time requires a reservation-wage estimate and does not imply a normative compensation level."

