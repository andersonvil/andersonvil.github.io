long_positioning = "I study how observed choices can identify latent economic quantities: individual resource shares, the value of parental time, and the monetary and time costs of children. My work combines applied microeconometrics with structural models of household behavior. Current projects extend this program to remote work, care for elderly parents, and post-divorce resource allocation."
bio = [
  "I am a household and labor economist, a Research Fellow at CY Cergy Paris Université (THEMA), and a Lecturer in Economics at Université Catholique de l’Ouest. I received my PhD in Economics from CY Cergy Paris Université in 2024, under the supervision of Olivier Donni.",
  "My research examines how households allocate money and time, and how children, caregiving, and work arrangements shape consumption, labor supply, leisure, and the distribution of resources within families. I develop and estimate structural models using applied microeconometric methods, expenditure data, and time-use data to recover economic quantities that household surveys do not directly reveal. I also study how commodity taxation and trade costs affect firm location, skilled wages, and welfare."
]
