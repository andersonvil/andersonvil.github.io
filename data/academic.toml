[[work_in_progress]]
title = "Bargaining over Children: A Model of Post-Divorce Resource Allocation"
author_line = "Anderson Vil, Nicolas Djob and Thierry Nana Noumi"
description = "A dynamic model of child support and spending on children after divorce, in which parents learn about each other and revise their cooperation. The project examines how beliefs, strategic behavior, and court orders shape transfers and children’s material well-being."

[[work_in_progress]]
title = "A Model of Work from Home"
author_line = "Anderson Vil and Olivier Donni"
description = "A structural model of couples’ employment choices incorporating remote work, on-site costs, and household production. The project seeks to distinguish preferences for working from home from constraints on access to hybrid jobs, and examines their implications for work and time allocation."

[[work_in_progress]]
title = "Estimating the Cost of Caring for Elderly Parents"
author_line = "Anderson Vil and Arnaud Daymard"
description = "A family model for measuring the money and time devoted to elderly parents and how these costs are shared among adult siblings. It examines how paid care, satisfaction from caregiving, and constraints on working hours affect the value of caregivers’ time."

[[work_in_progress]]
title = "Commodity Tax Principles, Iceberg Trade Costs, and Skilled-Wage Incidence"
author_line = "Anderson Vil, Nicolas Djob and Usama Jamal"
description = "The project compares origin- and destination-based commodity taxation when trade is costly, firms are mobile, and skilled wages adjust. It examines how firm location, wages, and tax competition jointly shape welfare, beyond the effects of relocation alone."
