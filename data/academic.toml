findings = "In the benchmark specification, the productive share of childcare time is 0.44 for mothers (standard error 0.26) and 0.35 for fathers (0.21). The median time cost for one child is about $230 per week, compared with roughly $350 under wage valuation. Monetary and total-cost estimates are substantially less stable, so the manuscript’s specification-specific total above $800 is not treated as a headline estimate."
limitations = "The sample is selected on dual employment and young children, excludes long-run career effects, and relies on broad retrospective childcare reports. The smooth time adjustment changes the distribution, childcare spending and time refer to different periods, and formal-care rationing or fixed costs may bias the productive share downward. Monetary identification is weak and regularized; 2017 robustness estimates are sensitive."

[[papers]]
id = "children-costs-one-adult-household"
title = "Children Costs in a One-Adult Household: Empirical Evidence from the UK"
short_title = "Children Costs in a One-Adult Household"
authors = ["Anderson Vil"]
author_line = "Anderson Vil"
card_author_line = "Anderson Vil"
version = "January 12, 2026"
series = "PSE Working Paper No. 2025-37"
job_market = false
publicationStatus = "blocked"
real = true
provisional = true
synthetic = false
status_label = "Revise and resubmit — Review of Economics of the Household"
url = "/research/children-costs-one-adult-household/"
pdf = "/files/papers/children-costs-one-adult-household.pdf"
source_file = "03-research/paper-1.pdf"
description = "A collective consumption model for studying resource sharing and economies of scale in one-adult households with children."
abstract = "This paper addresses two central questions in family and economic policy. First, to what extent are estimates of the cost of children derived from two-parent households applicable to single-parent families? Second, are estimated patterns of intra-household resource allocation consistent with benefit rules that condition support uniformly on family size? To address these questions, I propose a collective consumption model for one-adult households, apply it to three datasets—the Family Expenditure Survey, the Expenditures and Food Survey, and the Living Costs and Food Survey in the UK—and present two key findings. First, child cost estimates derived from two-parent households remain externally valid for single-parent families, at least for single mothers. Second, the results find no evidence of per-child resource dilution by family size once estimation uncertainty is accounted for, with differences for fathers appearing only among households at the bottom of the expenditure distribution."
question = "Can estimates derived from couple households provide useful benchmarks for single-parent families?"
contribution = "The paper extends collective-consumption methods to one-adult households and estimates resource shares using UK expenditure surveys spanning 1978–2022."
nontechnical = "Household expenditure surveys mainly record spending at household level; they do not directly reveal the resources available to, or spending attributable to, each member. If individual consumption were fully observed and there were no shared goods or economies of scale, allocation would be easier to read—but the paper does not impose that as its general setting. Instead, adult clothing provides an assignable good. Under preference stability, its nonlinear Engel curve for comparable childless adults supplies a reference that helps infer parents’ resource shares and consumption scales. Estimates for single mothers are close to the couple-based benchmark. The point estimate for fathers is higher but less precise, and the mother–father difference is not statistically established; absence of a statistically established difference does not prove equality."
economic_model = "A static one-adult collective-consumption model combines Beckerian altruism, a Barten-style consumption technology, and a sharing rule. The observed household budget is separated into adult, child, and shared components; adult clothing is treated as an assignable good whose Engel curve helps recover latent resource shares."
identification_text = "Allocation is recoverable from four positive sources of information: stable preferences for the assignable good across comparable childless adults and parents; observed adult clothing; Engel curves that are nonlinear in log expenditure; and restrictions that separate the sharing rule from the Barten consumption scale. The benchmark uses decade indicators that predict clothing demand as excluded shifters from the sharing rule, with alternative restrictions used as robustness checks. Childless adults anchor the demand function; parental status, prices, expenditure and observed demographics then trace the latent resource share and scale."
econometric_model = "Equations (13)–(19) form gender-specific budget-share systems quadratic in log expenditure. Childless adults identify the reference clothing-demand parameters; for parents, the same preferences are evaluated at expenditure scaled by the sharing rule and prices scaled by the Barten factor. A logistic sharing rule and a parametric shadow-price equation are estimated jointly for childless adults and parents, separately by sex. Iterated nonlinear 2SLS instruments total expenditure with total income and adds interactions of parental status with second-order polynomials in exogenous variables; the cross-equation covariance matrix initializes the iterative weighting matrix."
data_summary = "The harmonized Family Expenditure Survey, Expenditure and Food Survey, and Living Costs and Food Survey cover 1978–2022. The final analytical sample contains 40,403 one-adult households: 14,070 single men, 10,911 single women, 1,579 single fathers, and 13,843 single mothers. Monetary values in the descriptive table are expressed in 1987 pounds."
data_table_caption = "Selected means from the harmonized UK sample (1987 pounds/week)"
data_table_headers = ["Variables", "Women", "Men", "Mothers · 1", "Mothers · 2", "Mothers · 3", "Fathers · 1", "Fathers · 2", "Fathers · 3"]
data_table_rows = [
  ["Adult clothing, £/week", "9.46 (18.44)", "5.34 (15.60)", "7.53 (15.07)", "6.29 (13.51)", "5.15 (11.27)", "4.34 (11.97)", "3.56 (10.28)", "2.02 (6.90)"],
  ["Zero clothing share", "0.43 (0.50)", "0.72 (0.45)", "0.44 (0.50)", "0.46 (0.50)", "0.48 (0.50)", "0.71 (0.46)", "0.71 (0.45)", "0.81 (0.39)"],
  ["Total expenditure, £/week", "117.31 (83.99)", "124.80 (94.32)", "136.44 (95.07)", "143.89 (96.73)", "143.73 (93.80)", "158.68 (103.31)", "161.80 (105.14)", "158.26 (91.54)"],
  ["Labor-market participation", "0.71 (0.45)", "0.65 (0.48)", "0.50 (0.50)", "0.43 (0.49)", "0.29 (0.45)", "0.55 (0.50)", "0.51 (0.50)", "0.41 (0.49)"],
  ["Education, years", "12.49 (3.42)", "12.34 (3.44)", "11.77 (2.44)", "11.61 (2.25)", "11.32 (2.10)", "11.34 (2.19)", "11.49 (2.27)", "11.53 (2.31)"],
  ["Age", "39.25 (11.14)", "38.40 (10.22)", "34.96 (9.21)", "34.01 (7.06)", "33.47 (5.92)", "38.63 (9.12)", "37.49 (7.84)", "35.88 (7.08)"],
  ["Observations", "10,924", "14,059", "7,084", "4,639", "1,561", "910", "485", "135"]
]
findings = "For a representative one-child household, the estimated child resource share is 14.7% for single mothers (standard error 6.1 percentage points), 22.2% for single fathers (8.5 points), and 14.2% in the couple reference. The mother–father difference is not statistically established. The analysis finds no systematic per-child dilution once estimation uncertainty is included, although low-expenditure father households warrant separate attention."
limitations = "Results depend on preference stability, the assignable-good structure, and exclusion restrictions; fertility selection is not eliminated. Clothing expenditure contains many zeros, father samples are small, and policy interpretations are not causal. The OECD one-child scale implies a 23% share, but that comparison is a benchmark, not a welfare prescription."

[[papers]]
id = "children-labor-supply-equations"
title = "How to Incorporate Children into Labor Supply Equations? An Equivalence-Scale Approach"
short_title = "Children in Labor Supply Equations"
authors = ["Olivier Donni", "Anderson Vil"]
author_line = "Olivier Donni and Anderson Vil"
card_author_line = "with Olivier Donni"
version = "October 16, 2026"
series = "PSE Working Paper No. 2025-40"
job_market = false
publicationStatus = "blocked"
real = true
provisional = true
synthetic = false
status_label = "Submitted — The Economic Journal"
url = "/research/children-labor-supply-equations/"
pdf = "/files/papers/children-labor-supply-equations.pdf"
source_file = "03-research/paper-2.pdf"
source_title = "How to Incorporate Childen into Labor Supply Equations? An Equivalence-Scale Approach"
description = "A framework that represents children's monetary and time channels directly in labor-supply equations."
abstract = "We propose a method for modeling the impact of children on labor supply. Building on equivalence scales and collective models, our approach jointly considers the time and monetary costs of children. By imposing restrictions on childcare technology, we identify the total cost of children from labor supply equations with modest data inputs. We apply the model to single mothers from the 2019 PSID. Results suggest labor supply responsiveness to wages is higher for women with children, while the opposite holds for exogenous incomes. We also estimate the total cost of children and the time spent on childcare."
question = "How can children enter labor-supply models as economic mechanisms rather than as demographic controls?"
contribution = "The paper connects equivalence scales, childcare technology, and labor supply so that monetary and time costs can be identified with modest data requirements."
nontechnical = "This paper develops a theory-consistent method for incorporating children into labor-supply models. In the model, resources absorbed by children can push a parent to work more when leisure is normal, while childcare needs reduce the time available for work; the net effect on hours is therefore not determined a priori. The method uses the labor-supply function for women without children as a reference. Under stability and a structured monetary-cost function, changes in the shape and derivatives of labor supply reveal the displacement associated with child costs rather than treating children as demographic covariates. The approach can recover total cost without direct childcare-time or disaggregated-consumption data, but “modest data inputs” means fewer observed variables—not fewer assumptions. In the 2019 PSID application, mothers respond more to wages and less to exogenous resources than childless women. The resulting costs are positive, model-based quantities and should not be read as policy compensation recommendations."
economic_model = "A static model gives a single woman adult consumption, child consumption, leisure, paid work, and childcare time. Under the tractable specification, children shift labor supply through a time term and an effective-resource term: h(y,w,n) = F(w, y − a(n) − b_t(n)w − b_m(n)y) − b_t(n). The time shift reduces available hours; the resource shift creates an income effect when leisure is normal."
identification_text = "Why can child cost be recovered without observing every child-specific purchase or childcare hour? Labor supply for women without children identifies the reference function F. Under Assumption L, monetary child expenditure is linear in exogenous income. For participating women, curvature and derivatives of observed labor supply then reveal the resource displacement caused by children: with nonzero first and second income derivatives, total cost is point identified under regularity conditions; in the general linear case only the income-proportional component is identified. The later parametric model is more restrictive: its linear baseline imposes enough structure to identify total cost, so this is not a contradiction of the general result. Nonparticipants require still stronger assumptions and a reservation wage because no observed market wage supplies their price of time. Total cost is identified more robustly than its primitive monetary/time decomposition, although the value of parental time and the residual value of goods and services can be recovered."
econometric_model = "The reference equation is the quadratic Brown–Levin–Ulph labor supply h = α₀zʰ + α₁w + α₂y + α₃w² + α₄y² + α₅yw + u. Equations (17)–(21) insert the time cost (aₜ + bₜw)δ(n), the monetary cost (aₘ + bₘy)δ(n), and the resulting child-specific shifts; only a = aₜ + aₘ is separately identified. A control-function likelihood jointly handles participation and endogenous wages/resources. The wage equation (22) uses education among its shifters; the resource equation (23) uses income sources. Maximum likelihood integrates the latent wage for nonparticipants, and reservation wages obtained by inverting labor supply provide their price of time."
data_summary = "The sample includes 1,270 single women aged 20–60: 987 without children and 283 mothers with at most two children, the youngest aged six or under. The application uses annual hours, hourly wages, net total expenditure, education, age, and participation from the 2019 PSID."
data_table_caption = "Selected means, PSID 2019 (annual hours; dollars/hour; net expenditure in $000/year)"
data_table_headers = ["Variables", "All women", "Nonworking", "Working", "Childless", "Single mothers"]
data_table_rows = [
  ["Labor-market participation", "0.85 (0.36)", "0.00 (0.00)", "1.00 (0.00)", "0.83 (0.38)", "0.90 (0.30)"],
  ["Annual hours worked", "1,634.41 (980.81)", "0.00 (0.00)", "1,932.68 (748.80)", "1,638.58 (1,003.99)", "1,619.86 (896.80)"],
