[[papers]]
id = "household-demand-leisure"
title = "The Household Demand for Leisure, the Price of Time and the Full Cost of Children: A Structural Model and Evidence from the PSID"
short_title = "The Household Demand for Leisure and the Full Cost of Children"
authors = ["Olivier Donni", "Anderson Vil"]
author_line = "Olivier Donni and Anderson Vil"
card_author_line = "with Olivier Donni"
version = "October 4, 2026"
series = "PSE Working Paper No. 2025-38"
job_market = true
publicationStatus = "blocked"
real = true
provisional = true
synthetic = false
status_label = "Revise and resubmit — Journal of the European Economic Association"
url = "/research/household-demand-leisure/"
pdf = "/files/papers/household-demand-leisure.pdf"
source_file = "03-research/paper-3.pdf"
slides = "/files/slides/household-demand-leisure-eea-2026.pdf"
slides_title = "The Household Demand for Leisure, the Price of Time and the Full Cost of Children: A Structural Model and Evidence from the PSID"
slides_authors = "Anderson Vil, jointly with Olivier Donni"
slides_version = "August 17, 2026"
slides_event = "41st Annual Congress of the European Economic Association"
slides_format = "PDF · 16:9"
slides_pages = 42
slides_bytes = 634638
slides_real = true
slides_provisional = true
slides_publicationStatus = "blocked"
description = "A structural model that estimates the productive value of parental childcare time, rather than equating it with the market wage, and uses that value to compute the full cost of children."
abstract = "We propose a novel approach to estimating the full cost of children — the sum of monetary and time costs — by endogenizing the price of parental time rather than assuming it is equal to the parents’ wage rate. In this approach, the price of time depends on how parents perceive their time with children, whether as a leisure-like activity or more as a labor-like activity. We then develop a simplified collective model of leisure demand for working couples, incorporating individual preferences and childcare technology, and estimate it using 2019 PSID data. This allows us to recover the price of parental time and the full cost of children. We find that mothers perceive 44% of their childcare time as labor, compared to 35% for fathers. Our results also highlight that a substantial portion of the full cost of children is non-monetary."
question = "How should parental childcare time be valued when it is partly productive and partly experienced as leisure?"
contribution = "The paper first defines and estimates the productive price of parental childcare time from substitution between parental care and purchased childcare, then connects that price to the monetary and time components of child costs to compute the full cost of children."
nontechnical = "Automatically valuing every reported hour of childcare at a parent’s wage can be misleading: time with a child is productive, but some of it may also be experienced as leisure, and the PSID question includes passive childcare—supervision or availability that can coincide with other activities, including sleep. The model instead uses observed substitution between parental time and purchased care to estimate the labor-like share of childcare time and its productive price. It then combines that value with monetary spending to calculate time, monetary, and full child costs. ATUS is used to calibrate a nonlinear correction to the broad PSID reports; the adjusted PSID hours, not ATUS observations, are the reference measure in estimation. The estimates value parental time below the wage benchmark, but monetary-cost estimates are unstable and the time-cost results remain sensitive to the hours measure."
economic_model = "A collective model of dual-earner couples combines individual preferences with a childcare production technology. Full leisure is ordinary leisure plus the leisure-like share of childcare, Lᵢ = lᵢ + (1 − θᵢ)tᵢ. The productive share θᵢtᵢ is priced at θᵢwᵢ; purchased care and both parents’ productive time jointly produce childcare. The time cost is eᵀ = θᴴwᴴtᴴ + θᵂwᵂtᵂ + m, and full child cost adds monetary cost eᴹ."
identification_text = "The price of parental time is identified from how parental childcare hours and purchased childcare change with both spouses’ wages, including the corner with zero paid care. The monetary component is identified separately through full-leisure demand: under preference stability and the relevant sharing-rule restriction, the remaining full expenditure that restores adult full leisure provides a Rothbarth-style child-cost measure. The first step therefore identifies productive time prices; the second uses the resulting time cost and nonlinear full-leisure Engel curves to identify monetary and full cost."
econometric_model = "Estimation is recursive. For couples with children, equations (9)–(12) form a three-equation childcare system: parental-time equations are treated as uncensored and paid childcare is censored at zero, so the mixed linear/Tobit system is estimated by maximum likelihood. For the full sample, the quadratic full-leisure demands in equations (15)–(18) are estimated by 3SLS using predicted time cost and predicted full expenditure; nonlabor income and its square are excluded instruments for full expenditure. Monetary cost follows the positive softplus specification in equation (14). Ridge regularization stabilizes its weakly identified slopes, so conventional inference for that component is treated cautiously."
data_summary = "The analysis uses the 2019 PSID. From 9,569 households, the estimation sample keeps 825 dual-earner, heterosexual, nonstudent couples aged 22–50: 362 without children and 463 with at most two children, the youngest aged six or under. Childcare spending refers to the prior calendar year, while time refers to a typical interview-week measure."
data_table_caption = "Benchmark sample, mean (standard deviation), PSID 2019 (hours/week; dollars; education and age in years)"
data_table_headers = ["Variables", "Without children", "With children"]
data_table_rows = [
  ["Father adjusted childcare, hours/week", "0.00 (0.00)", "9.66 (20.65)"],
  ["Mother adjusted childcare, hours/week", "0.00 (0.00)", "18.97 (28.45)"],
