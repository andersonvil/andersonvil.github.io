base_url = "https://andersonvil.github.io"
title = "Anderson Vil"
description = "Academic site for Anderson Vil, household and labor economist."
default_language = "en"
compile_sass = false
build_search_index = false
generate_feeds = false
generate_sitemap = true
generate_robots_txt = false
ignored_content = ["preview-synthetic/**"]
